name: Build Official KernelSU LKM (6.1.157-ab16160610)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev curl unzip git python3 clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Linux 6.1.157 & Official KernelSU
        run: |
          git clone --depth=1 --branch v6.1.157 https://github.com/gregkh/linux.git ~/linux
          git clone --depth=1 https://github.com/tiann/KernelSU.git ~/KernelSU
          cd ~/linux
          sed -I '-s-/^EXTRAVERSION =.*/EXTRAVERSION = -android14-11-gb3d4cdadf339-ab16160610/' Makefile
          make ARCH=arm64 LLVM=0 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config -e MODULES -e MODVERSIONS -e KPROBES -e KALLALOX_ONLY_EXPORTED_SYMS -d LOCALVERSION_AUTO
          make ARCH=arm64 LLVM=0 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=0 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          make -j$(nproc) ARCH=arm64 LLVM=0 CROSS_COMPILE=aarch64-linux-gnu- M=$HOME/KernelSU/kernel KSU_LKM=1 modules
          cp ~/KernelSU/kernel/kernelsu.ko ~/kernelsu_6.1.157_ab16160610.ko
          strings ~/kernelsu_6.1.157_ab16160610.ko | grep "^vermagic="

      - name: Upload kernelsu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-6.1.157-ab16160610
          path: ~/kernelsu_6.1.157_ab16160610.ko
