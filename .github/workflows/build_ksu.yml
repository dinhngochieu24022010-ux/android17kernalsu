name: Build Official KernelSU LKM (6.1.157-ab16160610)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev curl unzip git python3 clang llvm lld

      - name: Clone Android14-6.1 GKI & Official KernelSU
        run: |
          git clone --depth=1 --branch android14-6.1 https://android.googlesource.com/kernel/common.git ~/linux
          git clone --depth=1 https://github.com/tiann/KernelSU.git ~/KernelSU
          sed -i "1i ccflags-y += -DCONFIG_KSU_LKM=1" ~/KernelSU/kernel/Kbuild
          cd ~/linux
          python3 -c 'import re; s=open("Makefile").read(); s=re.sub(r"^VERSION =.*", "VERSION = 6", s, 1, re.M); s=re.sub(r"^PATCHLEVEL =.*", "PATCHLEVEL = 1", s, 1, re.M); s=re.sub(r"^SUBLEVEL =.*", "SUBLEVEL = 157", s, 1, re.M); s=re.sub(r"^EXTRAVERSION =.*", "EXTRAVERSION = -android14-11-gb3d4cdadf339-ab16160610", s, 1, re.M); open("Makefile","w").write(s)'
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/config -e MODULES -e MODVERSIONS -d LOCALVERSION_AUTO
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare security/selinux/
          cp $GITHUB_WORKSPACE/Module.symvers ~/linux/Module.symvers
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 M=$HOME/KernelSU/kernel CONFIG_KSU=m CONFIG_KSU_LKM=y KSU_LKM=1 KBUILD_MODPOST_WARN=1 modules
          cp ~/KernelSU/kernel/*.ko ~/kernelsu_6.1.157_ab16160610.ko
          modinfo ~/kernelsu_6.1.157_ab16160610.ko | head -n 15

      - name: Upload kernelsu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-6.1.157-ab16160610
          path: ~/kernelsu_6.1.157_ab16160610.ko
