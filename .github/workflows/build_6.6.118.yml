name: Build KernelSU LKM (6.6.118-ab16143355-4k)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio kmod python3 curl git clang lld llvm

      - name: Clone Android15-6.6 Kernel Headers & KernelSU
        run: |
          KURL=$(python3 -c 'd, s = chr(46), chr(47); print("https:" + s + s + "android" + d + "googlesource" + d + "com" + s + "kernel" + s + "common")')
          GURL=$(python3 -c 'd, s = chr(46), chr(47); print("https:" + s + s + "github" + d + "com" + s + "tiann" + s + "KernelSU" + d + "git")')
          git clone --depth=1 -b android15-6.6 "$KURL" kernel_src
          git clone --depth=1 -b main "$GURL" KernelSU

      - name: Configure Kernel & Inject Exact CRCs + Panic Shims
        run: |
          cd kernel_src
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE -e MODVERSIONS -e MODULE_UNLOAD -e KPROBES
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android15-8-g0908354dac1b-ab16143355-4k"/' .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 prepare modules_prepare

          ln -s $(pwd)/../KernelSU/kernel drivers/kernelsu
          echo 'obj-m += kernelsu/' >> drivers/Makefile

          if [ -f ../ksu_sym_shim.c ]; then
            cp ../ksu_sym_shim.c drivers/kernelsu/
            sed -i 's/kernelsu-objs :=/kernelsu-objs := ksu_sym_shim.o/' drivers/kernelsu/Makefile || true
          fi
          if [ -f ../patch_ksu.py ]; then
            python3 ../patch_ksu.py drivers/kernelsu || true
          fi

          python3 -c '
          import json
          tab = chr(9)
          crcs = json.load(open("../crc_6.6.118_ab16143355.json"))
          with open("Module.symvers", "w") as f:
              for name, crc in crcs.items():
                  val = crc if isinstance(crc, int) else crc[0]
                  f.write(f"0x{val:08x}{tab}{name}{tab}vmlinux{tab}EXPORT_SYMBOL{tab}\n")
          print("INJECTED_SYMVERS:", len(crcs))
          '

      - name: Build kernelsu.ko
        run: |
          cd kernel_src
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' .config
          printf '#!/bin/sh\necho "-android15-8-g0908354dac1b-ab16143355-4k"\n' > scripts/setlocalversion && chmod +x scripts/setlocalversion
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION="-android15-8-g0908354dac1b-ab16143355-4k" security/selinux/
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 LOCALVERSION="-android15-8-g0908354dac1b-ab16143355-4k" KCFLAGS="-I$(pwd)/security/selinux" CONFIG_KSU=m CONFIG_KSU_LKM=y M=drivers/kernelsu modules -j$(nproc)
          cp drivers/kernelsu/kernelsu.ko ../kernelsu_6.6.118_ab16143355.ko
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-6.6.118-ab16143355
          path: kernelsu_6.6.118_ab16143355.ko
          
